<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>스팸 판별기 (AI Spam Checker)</title>
  </head>
  <body>
    <h1>적당한 스팸 판별기 (AI Spam Checker)r</h1>
    <textarea
      id="text"
      rows="5"
      cols="60"
      placeholder="Win a FREE prize now"
    ></textarea
    ><br /><br />
    <button onclick="classify()">분류</button>
    <h3 id="result"></h3>
    <script>
      function classify() {
        const text = document.getElementById("text").value;

        // issue2: 빈 텍스트로 분류하려고 할 때 문제 해결

        const result = document.getElementById("result");
        if (!text.trim()) {
          result.innerText = "메시지를 입력해주세요.";
          return;
        }

        fetch("/classify", {
          method: "POST",
          body: JSON.stringify({ text }),
        })
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("result").innerText =
              "결과: " + data.label + " (score=" + data.score + ")";
          })
          .catch(() => {
            document.getElementById("result").innerText = "에러 발생";
          });
      }
    </script>
  </body>
</html>
